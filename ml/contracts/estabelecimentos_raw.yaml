# ==============================================================================
# Contrato de esquema del archivo Estabelecimentos (Receita Federal, CNPJ abierto)
# ==============================================================================
# Si el archivo deja de cumplir este contrato el pipeline se detiene en el paso
# `validate` (código de salida 2) y no entrena nada.
#
#   pattern               regex que debe cumplir cada valor no vacío (fullmatch)
#   allowed               conjunto cerrado de valores permitidos (no vacíos)
#   nullable              si se permiten vacíos
#   max_null_fraction     tope de vacíos (detecta columnas desplazadas)
#   max_invalid_fraction  tolerancia de valores que no cumplen pattern/allowed
#
# Las fracciones de referencia se midieron sobre el volcado 2023-08 (PR, 324 662 filas).

version: 1
delimiter: ";"
n_columns: 30
default_max_invalid_fraction: 0.001

columns:
  - {name: cnpj_basico, pattern: '\d{8}', nullable: false}
  - {name: cnpj_ordem, pattern: '\d{4}', nullable: false}
  - {name: cnpj_dv, pattern: '\d{2}', nullable: false}
  - {name: identificador_matriz_filial, allowed: ["1", "2"], nullable: false}
  - {name: nome_fantasia, nullable: true}
  - {name: situacao_cadastral, allowed: ["01", "02", "03", "04", "08"], nullable: false}
  - {name: data_situacao_cadastral, pattern: '(19|20)\d{6}|0', nullable: false}
  - {name: motivo_situacao_cadastral, pattern: '\d{2}', nullable: false}
  - {name: nome_cidade_exterior, nullable: true}
  - {name: pais, pattern: '\d{1,3}', nullable: true}
  - {name: data_inicio_atividade, pattern: '(19|20)\d{6}', nullable: false}
  - {name: cnae_fiscal_principal, pattern: '\d{7}', nullable: false}
  - {name: cnae_fiscal_secundaria, pattern: '\d{7}(,\d{7})*', nullable: true}
  - {name: tipo_logradouro, nullable: true, max_null_fraction: 0.05}
  - {name: logradouro, nullable: true, max_null_fraction: 0.05}
  - {name: numero, nullable: true}
  - {name: complemento, nullable: true}
  - {name: bairro, nullable: true, max_null_fraction: 0.10}
  - {name: cep, pattern: '\d{8}', nullable: true, max_null_fraction: 0.01}
  - {name: uf, pattern: '[A-Z]{2}', nullable: false}
  - {name: municipio, pattern: '\d{4}', nullable: false}
  - {name: ddd_1, pattern: '\d{1,4}', nullable: true, max_null_fraction: 0.60}
  - {name: telefone_1, nullable: true}
  - {name: ddd_2, pattern: '\d{1,4}', nullable: true}
  - {name: telefone_2, nullable: true}
  - {name: ddd_fax, pattern: '\d{1,4}', nullable: true}
  - {name: fax, nullable: true}
  - {name: correio_eletronico, nullable: true}
  - {name: situacao_especial, nullable: true}
  - {name: data_situacao_especial, pattern: '(19|20)\d{6}', nullable: true}
