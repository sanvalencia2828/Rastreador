version: '3.8'

services:
  # ==============================================================================
  # PostgreSQL + PostGIS Database
  # ==============================================================================
  db:
    image: postgis/postgis:15-3.4
    container_name: rastreador_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-londrina_comercio}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./street_tracking_schema.sql:/docker-entrypoint-initdb.d/street_tracking_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-londrina_comercio}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

