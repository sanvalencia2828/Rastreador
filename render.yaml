# Blueprint for the single Render web service.
# The existing service can also use the root Dockerfile, or the native commands
# documented in README.md. Do not put DATABASE_URL or JWT secrets in this file.
services:
  - type: web
    name: rastreador
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OSRM_URL
        sync: false
      - key: APP_TIMEZONE
        value: America/Sao_Paulo
      - key: FRONTEND_DIST
        value: /app/frontend/out
