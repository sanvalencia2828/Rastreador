services:
  - type: web
    name: rastreador-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rastreador-db
          property: connectionString
      - key: DB_HOST
        value: rastreador-db
      - key: DB_NAME
        value: londrina_comercio

databases:
  - name: rastreador-db
    databaseName: londrina_comercio
    user: postgres
    plan: free
