name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Import the API
        env:
          APP_ENV: development
        run: python -c "import api"

      - name: Backend tests
        env:
          APP_ENV: development
        run: pytest -q tests --ignore=tests/test_ml_pipeline.py

  ml-pipeline-test:
    name: ML Pipeline Tests (schema validation, train, evaluate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: requirements-ml.txt
      - run: pip install -r requirements-ml.txt
      - run: python -m pytest -q tests/test_ml_pipeline.py
      - run: docker build -f Dockerfile.ml -t rastreador-ml:ci .

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Type Check (TypeScript)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Next.js
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: |
          cd frontend
          npm run build
