name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Compile python files
        run: python -m compileall -q api.py app

      - name: Backend tests
        env:
          DATABASE_URL: ""
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rastreador
        run: pytest -q

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rastreador
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rastreador"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Type Check (TypeScript)
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Build Next.js static export
        env:
          NEXT_OUTPUT: export
          NEXT_PUBLIC_API_URL: ""
        run: |
          cd frontend
          npm run build
          test -f out/index.html
          test -f out/routes/index.html || test -f out/routes.html
